// ---------------------------------------------------------------------------
// 2. 날짜 유틸 (전부 'YYYY-MM-DD' 로컬 문자열 기준)
// ---------------------------------------------------------------------------

function toDateKey(date = new Date()) {
  const d = date instanceof Date ? date : new Date(date);
  if (Number.isNaN(d.getTime())) return null;
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(
    d.getDate()
  ).padStart(2, '0')}`;
}

function fromDateKey(key) {
  const [y, m, d] = String(key).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}

function addDays(key, days) {
  const date = fromDateKey(key);
  date.setDate(date.getDate() + days);
  return toDateKey(date);
}

function compareDateKey(a, b) {
  return a < b ? -1 : a > b ? 1 : 0;
}

const WEEKDAY_LABELS = ['일', '월', '화', '수', '목', '금', '토'];

function weekdayLabel(key) {
  return WEEKDAY_LABELS[fromDateKey(key).getDay()];
}

/**
 * start~end(양끝 포함) 사이에서 '공부하는 날'만 뽑아 준다.
 * holidays에 들어 있는 날짜와, 요일 단위 휴일(restWeekdays: [0,6] 등)은 제외한다.
 */
function listStudyDates(startDate, endDate, holidays = [], restWeekdays = []) {
  if (!startDate || !endDate || compareDateKey(startDate, endDate) > 0) return [];
  const holidaySet = new Set(holidays);
  const restSet = new Set(restWeekdays.map(Number));
  const dates = [];
  let cursor = startDate;
  // 무한 루프 방지용 상한 (약 2년)
  for (let guard = 0; guard < 800 && compareDateKey(cursor, endDate) <= 0; guard += 1) {
    const isHoliday = holidaySet.has(cursor) || restSet.has(fromDateKey(cursor).getDay());
    if (!isHoliday) dates.push(cursor);
    cursor = addDays(cursor, 1);
  }
  return dates;
}

// ---------------------------------------------------------------------------
// 3. 목표량 분배
// ---------------------------------------------------------------------------

/**
 * total을 slots개로 최대한 고르게 쪼갠다. 나머지는 앞쪽 날짜부터 1씩 더 얹는다.
 * 예) distributeAmount(10, 3) -> [4, 3, 3]
 * 결과 배열의 합은 항상 total과 같다. (아이가 "왜 총합이 안 맞지?" 하는 일이 없도록)
 */
function distributeAmount(total, slots) {
  const amount = Math.max(0, Math.round(Number(total) || 0));
  const count = Math.max(0, Math.round(Number(slots) || 0));
  if (count === 0) return [];
  const base = Math.floor(amount / count);
  const remainder = amount % count;
  return Array.from({ length: count }, (_, i) => base + (i < remainder ? 1 : 0));
}

/**
 * 목표(goal) 하나를 날짜별 권장량 맵으로 펼친다.
 *
 * goal = {
 *   id, category, workbook, title, unit,
 *   totalAmount,       // 전체 페이지 수 또는 문제 수
 *   startAmount,       // (선택) 시작 페이지 번호. 표시용
 *   startDate, endDate,
 *   holidays: ['2026-07-28'],   // 아이가 콕 집어 쉬기로 한 날
 *   restWeekdays: [0],          // 매주 쉬는 요일 (0=일)
 *   completedAmount,            // 지금까지 실제로 끝낸 양
 *   strategy,                   // 미달성 처리 방식
 *   carryOver,                  // PUSH 방식에서 다음 날로 넘어온 밀린 양
 * }
 *
 * @returns {{ [dateKey: string]: number }}
 */
function buildGoalSchedule(goal, { fromDate = null } = {}) {
  if (!goal || !goal.startDate || !goal.endDate) return {};
  const total = Math.max(0, Math.round(Number(goal.totalAmount) || 0));
  const done = Math.max(0, Math.round(Number(goal.completedAmount) || 0));
  const carryOver = Math.max(0, Math.round(Number(goal.carryOver) || 0));
  const remainingTotal = Math.max(0, total - done);
  // 밀린 분량(carryOver)은 아직 안 끝낸 양이라 remainingTotal에 이미 포함돼 있다.
  // 첫날에 따로 얹을 것이므로 나머지 날에 나눌 때는 빼 둔다. (이중 계산 방지)
  const spreadTotal = Math.max(0, remainingTotal - carryOver);

  // 목표 전체 기간의 공부일. PUSH 방식에서 "원래 정한 하루치"의 기준이 된다.
  const allDates = listStudyDates(goal.startDate, goal.endDate, goal.holidays, goal.restWeekdays);
  // 오늘(또는 fromDate) 이후 남은 공부 가능일
  const anchor = fromDate && compareDateKey(fromDate, goal.startDate) > 0 ? fromDate : goal.startDate;
  const dates = allDates.filter((d) => compareDateKey(d, anchor) >= 0);
  if (dates.length === 0) return {};

  let amounts;
  if (goal.strategy === MISS_STRATEGY.PUSH) {
    // 미루기 방식: 처음 정한 하루치를 그대로 지킨다. 밀린 양만 첫날에 몰아서 얹는다.
    const baseline = distributeAmount(total, allDates.length);
    amounts = trimToTotal(baseline.slice(allDates.length - dates.length), spreadTotal);
  } else {
    // 재계산 방식: 남은 분량을 남은 날에 다시 n분의 1 한다.
    amounts = distributeAmount(spreadTotal, dates.length);
  }

  const schedule = {};
  dates.forEach((date, index) => {
    schedule[date] = amounts[index] ?? 0;
  });
  if (carryOver > 0) schedule[dates[0]] += carryOver;
  return schedule;
}

/** 배열의 합이 cap을 넘지 않도록 뒤쪽 날짜부터 깎는다. (계획을 앞당겨 끝냈을 때 대비) */
function trimToTotal(amounts, cap) {
  const next = [...amounts];
  let excess = next.reduce((sum, v) => sum + v, 0) - Math.max(0, cap);
  for (let i = next.length - 1; i >= 0 && excess > 0; i -= 1) {
    const cut = Math.min(next[i], excess);
    next[i] -= cut;
    excess -= cut;
  }
  return next;
}

/** 특정 날짜에 이 목표로 해야 할 권장량 */
function getDailyQuota(goal, dateKey, options = {}) {
  const schedule = buildGoalSchedule(goal, options);
  return schedule[dateKey] ?? 0;
}

/**
 * 목표 진행 요약. 진행바/응원 문구에 쓴다.
 */
function summarizeGoal(goal, todayKey = toDateKey()) {
  const total = Math.max(0, Math.round(Number(goal?.totalAmount) || 0));
  const done = Math.min(total, Math.max(0, Math.round(Number(goal?.completedAmount) || 0)));
  const remaining = total - done;
  const remainingDays = listStudyDates(
    compareDateKey(todayKey, goal?.startDate ?? todayKey) > 0 ? todayKey : goal?.startDate,
    goal?.endDate,
    goal?.holidays,
    goal?.restWeekdays
  ).length;
  return {
    total,
    done,
    remaining,
    remainingDays,
    progressRate: total > 0 ? done / total : 0,
    perDay: remainingDays > 0 ? Math.ceil(remaining / remainingDays) : remaining,
    isFinished: total > 0 && done >= total,
    isOverdue: remainingDays === 0 && remaining > 0,
  };
}

/**
 * 오늘 목표를 다 못 끝냈을 때의 재계산.
 *
 * - PUSH:         못 한 만큼(shortfall)을 통째로 다음 공부일에 얹는다. 나머지 날은 그대로.
 * - REDISTRIBUTE: 남은 전체 분량을 남은 공부일 수로 다시 n분의 1 한다. 하루가 조금씩 늘어난다.
 *
 * @returns {{ goal, schedule, shortfall, nextDate, beforePerDay, afterPerDay }}
 */
function recalcAfterMiss(goal, todayKey, plannedAmount, doneAmount, strategy) {
  const planned = Math.max(0, Math.round(Number(plannedAmount) || 0));
  const finished = Math.max(0, Math.round(Number(doneAmount) || 0));
  const shortfall = Math.max(0, planned - finished);
  const nextDate = nextStudyDate(goal, todayKey);

  const beforeSchedule = buildGoalSchedule(goal, { fromDate: todayKey });
  const beforePerDay = nextDate ? beforeSchedule[nextDate] ?? 0 : 0;

  if (shortfall === 0 || !nextDate) {
    return {
      goal: { ...goal, carryOver: 0 },
      schedule: buildGoalSchedule({ ...goal, carryOver: 0 }, { fromDate: nextDate ?? todayKey }),
      shortfall,
      nextDate,
      beforePerDay,
      afterPerDay: beforePerDay,
    };
  }

  const nextGoal =
    strategy === MISS_STRATEGY.PUSH
      ? { ...goal, carryOver: Math.max(0, Number(goal.carryOver) || 0) + shortfall, strategy }
      : { ...goal, carryOver: 0, strategy };

  const schedule = buildGoalSchedule(nextGoal, { fromDate: nextDate });
  return {
    goal: nextGoal,
    schedule,
    shortfall,
    nextDate,
    beforePerDay,
    afterPerDay: schedule[nextDate] ?? 0,
  };
}

/** 오늘 다음으로 공부하는 날 (휴일 건너뜀). 기간이 끝났으면 null */
function nextStudyDate(goal, todayKey) {
  const dates = listStudyDates(
    addDays(todayKey, 1),
    goal?.endDate,
    goal?.holidays,
    goal?.restWeekdays
  );
  return dates.length > 0 ? dates[0] : null;
}

/**
 * 목표 목록에서 특정 날짜의 할 일 후보를 만들어 준다.
 * 아이가 "오늘 할 일 자동으로 담기" 버튼을 눌렀을 때 쓰인다.
 */
function buildTasksForDate(goals = [], dateKey) {
  return goals
    .map((goal) => {
      const amount = getDailyQuota(goal, dateKey, { fromDate: dateKey });
      if (amount <= 0) return null;
      const category = CATEGORIES.find((c) => c.key === goal.category);
      return {
        id: `${goal.id}-${dateKey}`,
        goalId: goal.id,
        category: goal.category,
        subject: category?.subject ?? '기타',
        workbook: goal.workbook,
        title: goal.title || goal.workbook,
        unit: goal.unit || 'page',
        amount,
        doneAmount: 0,
        done: false,
        minutes: DEFAULT_TASK_MINUTES,
      };
    })
    .filter(Boolean);
}

// ---------------------------------------------------------------------------
// 4. 시간표
// ---------------------------------------------------------------------------

/**
 * 아침 7시부터 아이가 정한 종료 시각까지, slotMinutes 단위의 빈칸을 만든다.
 * @returns [{ index, startMinutes, endMinutes, label }]
 */
function buildTimeSlots(endHour = DEFAULT_END_HOUR, slotMinutes = DEFAULT_SLOT_MINUTES) {
  const step = SLOT_MINUTE_OPTIONS.includes(Number(slotMinutes))
    ? Number(slotMinutes)
    : DEFAULT_SLOT_MINUTES;
  const end = Math.min(TIMETABLE_MAX_HOUR, Math.max(TIMETABLE_START_HOUR + 1, Number(endHour) || DEFAULT_END_HOUR));
  const startMin = TIMETABLE_START_HOUR * 60;
  const endMin = end * 60;
  const slots = [];
  for (let m = startMin, index = 0; m < endMin; m += step, index += 1) {
    slots.push({
      index,
      startMinutes: m,
      endMinutes: Math.min(m + step, endMin),
      label: formatMinutes(m),
      endLabel: formatMinutes(Math.min(m + step, endMin)),
    });
  }
  return slots;
}

function formatMinutes(totalMinutes) {
  const m = Math.max(0, Math.round(Number(totalMinutes) || 0));
  const hour = Math.floor(m / 60) % 24;
  const minute = m % 60;
  return `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
}

/** 지금 시각이 몇 번째 슬롯인지. 시간표 진입 시 자동 스크롤 위치 계산에 쓴다. */
function currentSlotIndex(slots = [], now = new Date()) {
  if (slots.length === 0) return 0;
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  if (nowMinutes <= slots[0].startMinutes) return 0;
  const found = slots.findIndex((slot) => nowMinutes >= slot.startMinutes && nowMinutes < slot.endMinutes);
  return found >= 0 ? found : slots.length - 1;
}

/** 할 일 1개당 기본 30분 → 슬롯 몇 칸을 차지하는지 */
function slotSpanForTask(task, slotMinutes = DEFAULT_SLOT_MINUTES) {
  const minutes = Math.max(slotMinutes, Number(task?.minutes) || DEFAULT_TASK_MINUTES);
  return Math.max(1, Math.round(minutes / slotMinutes));
}

// 5. 통계 & 포인트
// ---------------------------------------------------------------------------

/**
 * 오늘의 공부 통계. 과목 비중 차트와 "몇 페이지 / 몇 문제" 요약에 그대로 꽂아 쓴다.
 */
function calcDayStats(tasks = []) {
  const bySubject = {};
  SUBJECTS.forEach((subject) => {
    bySubject[subject] = { planned: 0, done: 0, minutes: 0, count: 0 };
  });

  let plannedPages = 0;
  let donePages = 0;
  let plannedProblems = 0;
  let doneProblems = 0;
  let plannedTotal = 0;
  let doneTotal = 0;
  let doneCount = 0;

  tasks.forEach((task) => {
    const category = CATEGORIES.find((c) => c.key === task.category);
    const subject = task.subject ?? category?.subject ?? '기타';
    const planned = Math.max(0, Number(task.amount) || 0);
    const done = task.done
      ? Math.max(0, Number(task.doneAmount) || planned)
      : Math.max(0, Number(task.doneAmount) || 0);

    if (!bySubject[subject]) bySubject[subject] = { planned: 0, done: 0, minutes: 0, count: 0 };
    bySubject[subject].planned += planned;
    bySubject[subject].done += done;
    bySubject[subject].minutes += Number(task.minutes) || DEFAULT_TASK_MINUTES;
    bySubject[subject].count += 1;

    plannedTotal += planned;
    doneTotal += Math.min(done, planned);
    if (task.done) doneCount += 1;

    if (task.unit === 'problem') {
      plannedProblems += planned;
      doneProblems += done;
    } else {
      plannedPages += planned;
      donePages += done;
    }
  });

  const achievementRate = plannedTotal > 0 ? Math.min(1, doneTotal / plannedTotal) : 0;

  // 원형 차트용: 계획된 분량 기준 과목 비중(%)
  const subjectShares = SUBJECTS.map((subject) => {
    const entry = bySubject[subject] ?? { planned: 0, done: 0, minutes: 0, count: 0 };
    return {
      subject,
      color: SUBJECT_COLORS[subject],
      planned: entry.planned,
      done: entry.done,
      minutes: entry.minutes,
      count: entry.count,
      plannedShare: plannedTotal > 0 ? entry.planned / plannedTotal : 0,
      doneShare: doneTotal > 0 ? entry.done / doneTotal : 0,
    };
  }).filter((entry) => entry.count > 0);

  return {
    taskCount: tasks.length,
    doneCount,
    plannedTotal,
    doneTotal,
    achievementRate,
    plannedPages,
    donePages,
    plannedProblems,
    doneProblems,
    totalMinutes: tasks.reduce((sum, t) => sum + (Number(t.minutes) || DEFAULT_TASK_MINUTES), 0),
    bySubject,
    subjectShares,
  };
}

/**
 * 달성률 기반 포인트. 하루 목표를 전부 끝내면 MAX_DAILY_PLANNER_POINTS(100P).
 * 계획을 몇 개 세웠는지와 무관하게 "오늘 정한 걸 얼마나 해냈나"만 본다.
 */
function calcPlannerPoints(tasks = [], maxPoints = MAX_DAILY_PLANNER_POINTS) {
  const { achievementRate, plannedTotal } = calcDayStats(tasks);
  if (plannedTotal === 0) return 0;
  return Math.round(achievementRate * maxPoints);
}

/**
 * 이미 지급한 포인트를 빼고, 이번에 추가로 줄 포인트만 계산한다.
 * (아이가 체크했다 풀었다 반복해도 포인트가 중복 지급되지 않는다.)
 */
function calcPointDelta(tasks = [], alreadyAwarded = 0) {
  const earned = calcPlannerPoints(tasks);
  return Math.max(0, earned - Math.max(0, Math.round(Number(alreadyAwarded) || 0)));
}

/** 달성률에 맞춘 강아지 응원 문구 */
function cheerMessage(rate) {
  if (rate >= 1) return '오늘 계획 전부 완료! 최고의 하루였어요 🐶🎉';
  if (rate >= 0.7) return '거의 다 왔어요! 조금만 더 힘내요 🐾';
  if (rate >= 0.4) return '절반쯤 왔어요. 잘하고 있어요 🐕';
  if (rate > 0) return '시작이 반이에요! 하나씩 해봐요 🐶';
  return '오늘 할 일을 골라서 시간표에 담아 볼까요? 🦴';
}

// 동물 캐릭터 마스코트: 구글 드라이브 CDN의 투명 PNG(@/lib/characters)를 장식용으로 배치한다.
// - height로 크기를 정하고 가로세로 비율은 원본 그대로 유지한다.
// - animate: 'bob'(위아래로 둥실) | 'wiggle'(좌우로 살랑) | 'none'
// - delay: 여러 마리를 나란히 둘 때 애니메이션 시작을 어긋나게 해 자연스럽게 보이게 한다.
// - flip: 좌우 반전 (애니메이션 transform과 충돌하지 않도록 바깥 span에 적용)
function CharacterMascot({
  name,
  height = 72,
  animate = 'bob',
  delay = 0,
  flip = false,
  className = '',
  style = {},
}) {
  const character = CHARACTERS[name];
  if (!character) return null;

  const animationClass =
    animate === 'bob'
      ? 'animate-mascot-bob'
      : animate === 'wiggle'
        ? 'animate-mascot-wiggle'
        : '';

  // 원본 비율(naturalWidth/naturalHeight)로 렌더 너비를 미리 계산해 <img>에 width/height를
  // 명시한다. 원격 이미지가 도착하기 전에도 브라우저가 정확한 자리를 잡아 레이아웃이 밀리지 않는다.
  const width = Math.round((height * character.naturalWidth) / character.naturalHeight);

  return (
    <span
      className={`inline-block leading-none ${flip ? 'scale-x-[-1]' : ''} ${className}`}
      style={style}
      aria-hidden={character.alt ? undefined : true}
    >
      {/* next/image 대신 순수 img: 장식용이라 최적화보다 단순함이 우선이고, 구글 드라이브 원격 링크를 그대로 쓴다. */}
      {/* eslint-disable-next-line @next/next/no-img-element */}
      <img
        src={character.src}
        alt={character.alt}
        width={width}
        height={height}
        draggable={false}
        style={{ height, width, animationDelay: delay ? `${delay}ms` : undefined }}
        className={`pointer-events-none max-w-none select-none object-contain drop-shadow-sm ${animationClass}`}
      />
    </span>
  );
}

/** 과목 비중 도넛 차트 (외부 라이브러리 없이 SVG로 직접 그린다) */
function SubjectDonut({ shares, mode = 'planned', size = 148 }) {
  const key = mode === 'done' ? 'doneShare' : 'plannedShare';
  const visible = shares.filter((s) => s[key] > 0);
  const total = visible.reduce((sum, s) => sum + s[key], 0);
  const radius = size / 2 - 12;
  const circumference = 2 * Math.PI * radius;

  if (total <= 0) {
    return (
      <div
        className="flex items-center justify-center rounded-full border-8 border-amber-100 text-center text-xs font-bold text-stone-400"
        style={{ width: size, height: size }}
      >
        아직 기록이
        <br />
        없어요 🐾
      </div>
    );
  }

  let offset = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label="과목 비중">
      <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="#FEF3C7" strokeWidth="18" />
      {visible.map((share) => {
        const ratio = share[key] / total;
        const dash = ratio * circumference;
        const el = (
          <circle
            key={share.subject}
            cx={size / 2}
            cy={size / 2}
            r={radius}
            fill="none"
            stroke={share.color}
            strokeWidth="18"
            strokeLinecap="butt"
            strokeDasharray={`${dash} ${circumference - dash}`}
            strokeDashoffset={-offset}
            transform={`rotate(-90 ${size / 2} ${size / 2})`}
          />
        );
        offset += dash;
        return el;
      })}
      <text
        x="50%"
        y="47%"
        textAnchor="middle"
        className="fill-stone-500"
        style={{ fontSize: 12, fontWeight: 700 }}
      >
        과목 비중
      </text>
      <text x="50%" y="66%" textAnchor="middle" style={{ fontSize: 20 }}>
        🐶
      </text>
    </svg>
  );
}

    const onKey = (e) => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/60 p-4 backdrop-blur-sm"
      role="dialog"
      aria-modal="true"
      onMouseDown={(e) => e.target === e.currentTarget && onClose()}
    >
      <div className={`w-full ${maxWidth} overflow-hidden rounded-[2rem] border-4 border-white bg-amber-50 shadow-2xl`}>
        <div className="flex items-center gap-3 bg-gradient-to-r from-rose-100 to-amber-100 p-5">
          <span className="text-3xl">🐶</span>
          <div className="min-w-0 flex-1">
            <p className="text-xs font-bold text-rose-500">{subtitle}</p>
            <h2 className="text-xl font-extrabold text-stone-700">{title}</h2>
          </div>
          <button
            type="button"
            onClick={onClose}
            className="rounded-full bg-white px-4 py-2 text-sm font-bold text-rose-500 shadow-sm hover:bg-rose-50"
          >
            닫기 ✕
          </button>
        </div>
        <div className="max-h-[70vh] overflow-y-auto p-5">{children}</div>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// 메인 컴포넌트
// ---------------------------------------------------------------------------

function StudyPlanner({ userName, onPointsAwarded }) {
  const todayKey = toDateKey();
  const [date, setDate] = useState(todayKey);
  const [planner, setPlanner] = useState(() => ({ goals: [], days: {} }));
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [notice, setNotice] = useState(null);

  const [goalModalOpen, setGoalModalOpen] = useState(false);
  const [taskModalOpen, setTaskModalOpen] = useState(false);
  const [slotPickerIndex, setSlotPickerIndex] = useState(null);
  const [missModal, setMissModal] = useState(null);
  const [statsMode, setStatsMode] = useState('planned');

  const timetableRef = useRef(null);
  const saveTimerRef = useRef(null);
  const loadedRef = useRef(false);

  // ---- 로딩 -------------------------------------------------------------
  useEffect(() => {
    let alive = true;
    (async () => {
      const cached = readPlannerCache(userName);
      if (cached && alive) setPlanner(normalizePlanner(cached));
      const { planner: remote, error } = await fetchPlanner(userName);
      if (!alive) return;
      if (remote) setPlanner(normalizePlanner(remote));
      if (error && !remote) setNotice('오프라인 상태예요. 계획은 이 기기에 저장할게요 🐾');
      setLoading(false);
      loadedRef.current = true;
    })();
    return () => {
      alive = false;
    };
  }, [userName]);

  // ---- 자동 저장(디바운스) -----------------------------------------------
  const persist = useCallback(
    (next) => {
      writePlannerCache(userName, next);
      if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
      saveTimerRef.current = setTimeout(async () => {
        setSaving(true);
        try {
          await savePlanner(next, userName);
        } catch {
          setNotice('저장이 늦어지고 있어요. 계획은 안전하게 보관 중이에요 🐾');
        } finally {
          setSaving(false);
        }
      }, 800);
    },
    [userName]
  );

  const update = useCallback(
    (recipe) => {
      setPlanner((prev) => {
        const next = recipe(prev);
        if (loadedRef.current) persist(next);
        return next;
      });
    },
    [persist]
  );

  const day = planner.days[date] ?? createEmptyDayPlan(date);
  const goals = planner.goals ?? [];

  const setDay = useCallback(
    (recipe) => {
      update((prev) => {
        const current = prev.days[date] ?? createEmptyDayPlan(date);
        return { ...prev, days: { ...prev.days, [date]: recipe(current) } };
      });
    },
    [date, update]
  );

  // ---- 파생값 -----------------------------------------------------------
  const slots = useMemo(
    () => buildTimeSlots(day.endHour, day.slotMinutes),
    [day.endHour, day.slotMinutes]
  );
  const stats = useMemo(() => calcDayStats(day.tasks), [day.tasks]);
  const tasksById = useMemo(
    () => Object.fromEntries(day.tasks.map((t) => [t.id, t])),
    [day.tasks]
  );
  const assignedTaskIds = useMemo(
    () => new Set(Object.values(day.assignments ?? {})),
    [day.assignments]
  );

  // 시간표 진입 시 현재 시각으로 스크롤
  useEffect(() => {
    if (!day.setupDone || slots.length === 0 || date !== todayKey) return;
    const container = timetableRef.current;
    if (!container) return;
    const index = currentSlotIndex(slots);
    const row = container.querySelector(`[data-slot="${index}"]`);
    if (row) {
      container.scrollTop = Math.max(0, row.offsetTop - container.clientHeight / 3);
    }
  }, [day.setupDone, slots, date, todayKey]);

  // ---- 액션 -------------------------------------------------------------

  const handleAutoFill = () => {
    const generated = buildTasksForDate(goals, date);
    if (generated.length === 0) {
      setNotice('오늘 배정할 목표가 없어요. 먼저 기간 목표를 만들어 볼까요? 🦴');
      return;
    }
    setDay((prev) => {
      const existingGoalIds = new Set(prev.tasks.map((t) => t.goalId).filter(Boolean));
      const fresh = generated.filter((t) => !existingGoalIds.has(t.goalId));
      return { ...prev, tasks: [...prev.tasks, ...fresh] };
    });
    setNotice(null);
  };

  const handleAddTask = (draft) => {
    setDay((prev) => ({ ...prev, tasks: [...prev.tasks, createTask(draft)] }));
    setTaskModalOpen(false);
  };

  const handleRemoveTask = (taskId) => {
    setDay((prev) => ({
      ...prev,
      tasks: prev.tasks.filter((t) => t.id !== taskId),
      assignments: Object.fromEntries(
        Object.entries(prev.assignments ?? {}).filter(([, id]) => id !== taskId)
      ),
    }));
  };

  const handleToggleTask = (taskId) => {
    setDay((prev) => ({
      ...prev,
      tasks: prev.tasks.map((t) =>
        t.id === taskId
          ? { ...t, done: !t.done, doneAmount: !t.done ? t.amount : 0 }
          : t
      ),
    }));
  };

  const handleChangeDoneAmount = (taskId, value) => {
    setDay((prev) => ({
      ...prev,
      tasks: prev.tasks.map((t) => {
        if (t.id !== taskId) return t;
        const doneAmount = Math.max(0, Math.min(t.amount, Math.round(Number(value) || 0)));
        return { ...t, doneAmount, done: doneAmount >= t.amount && t.amount > 0 };
      }),
    }));
  };

  const handleAssignSlot = (slotIndex, taskId) => {
    setDay((prev) => {
      const next = { ...(prev.assignments ?? {}) };
      // 같은 할 일이 다른 칸에 이미 있으면 옮기는 것으로 처리한다.
      Object.keys(next).forEach((key) => {
        if (next[key] === taskId) delete next[key];
      });
      if (taskId) next[slotIndex] = taskId;
      else delete next[slotIndex];
      return { ...prev, assignments: next };
    });
    setSlotPickerIndex(null);
  };

  const handleAddGoal = (draft) => {
    update((prev) => ({ ...prev, goals: [...prev.goals, createGoal(draft)] }));
    setGoalModalOpen(false);
  };

  const handleRemoveGoal = (goalId) => {
    update((prev) => ({ ...prev, goals: prev.goals.filter((g) => g.id !== goalId) }));
  };

  const handleToggleHoliday = (goalId, dateKey) => {
    update((prev) => ({
      ...prev,
      goals: prev.goals.map((g) => {
        if (g.id !== goalId) return g;
        const holidays = new Set(g.holidays ?? []);
        if (holidays.has(dateKey)) holidays.delete(dateKey);
        else holidays.add(dateKey);
        return { ...g, holidays: [...holidays].sort() };
      }),
    }));
  };

  const handleToggleRestWeekday = (goalId, weekday) => {
    update((prev) => ({
      ...prev,
      goals: prev.goals.map((g) => {
        if (g.id !== goalId) return g;
        const rest = new Set(g.restWeekdays ?? []);
        if (rest.has(weekday)) rest.delete(weekday);
        else rest.add(weekday);
        return { ...g, restWeekdays: [...rest].sort() };
      }),
    }));
  };

  // 하루 마감: 포인트 지급 + 목표 진행도 반영 + 미달성 처리 안내
  const handleCloseDay = async () => {
    if (day.tasks.length === 0) {
      setNotice('오늘 할 일이 없어요. 먼저 계획을 세워 볼까요? 🐾');
      return;
    }
    const delta = calcPointDelta(day.tasks, day.pointsAwarded);
    const earned = calcPlannerPoints(day.tasks);

    // 완료한 만큼 각 목표의 누적 진행도에 더한다.
    update((prev) => {
      const gains = {};
      day.tasks.forEach((t) => {
        if (!t.goalId) return;
        const done = t.done ? t.amount : Math.max(0, Number(t.doneAmount) || 0);
        gains[t.goalId] = (gains[t.goalId] || 0) + done;
      });
      const prevAwarded = prev.days[date]?.pointsAwarded ?? 0;
      const prevGains = prev.days[date]?.appliedGains ?? {};
      return {
        ...prev,
        goals: prev.goals.map((g) =>
          gains[g.id] != null
            ? {
                ...g,
                // 재마감해도 중복 누적되지 않도록 이전에 반영한 양을 뺀다.
                completedAmount: Math.max(
                  0,
                  (Number(g.completedAmount) || 0) - (prevGains[g.id] || 0) + gains[g.id]
                ),
              }
            : g
        ),
        days: {
          ...prev.days,
          [date]: {
            ...(prev.days[date] ?? createEmptyDayPlan(date)),
            closed: true,
            pointsAwarded: Math.max(prevAwarded, earned),
            appliedGains: gains,
          },
        },
      };
    });

    if (delta > 0) {
      try {
        await awardPlannerPoints(date, delta, stats.achievementRate, userName);
        onPointsAwarded?.(delta, date);
        setNotice(`오늘 계획 ${Math.round(stats.achievementRate * 100)}% 달성! 💰 ${delta}P 받았어요 🎉`);
      } catch {
        onPointsAwarded?.(delta, date);
        setNotice(`💰 ${delta}P 획득! (서버 반영은 잠시 후 다시 시도할게요 🐾)`);
      }
    } else {
      setNotice('오늘 기록을 저장했어요 🐾');
    }

    // 못 끝낸 목표가 있으면 처리 방법을 묻는다.
    const missed = day.tasks.filter(
      (t) => t.goalId && (t.done ? t.amount : Number(t.doneAmount) || 0) < t.amount
    );
    if (missed.length > 0) setMissModal({ tasks: missed });
  };

  const handleApplyMissStrategy = (strategy) => {
    update((prev) => {
      let nextGoals = prev.goals;
      (missModal?.tasks ?? []).forEach((task) => {
        nextGoals = nextGoals.map((g) => {
          if (g.id !== task.goalId) return g;
          const done = task.done ? task.amount : Number(task.doneAmount) || 0;
          const { goal } = recalcAfterMiss(g, date, task.amount, done, strategy);
          return goal;
        });
      });
      return { ...prev, goals: nextGoals };
    });
    setMissModal(null);
    setNotice(
      strategy === MISS_STRATEGY.PUSH
        ? '못 한 만큼 내일로 옮겼어요. 내일 조금만 더 힘내요! 🐶'
        : '남은 기간에 맞춰 골고루 다시 나눴어요. 부담 없이 가요 🐾'
    );
  };

  // ---- 렌더 -------------------------------------------------------------

  if (loading) {
    return (
      <div className="flex flex-col items-center gap-4 py-20">
        <CharacterMascot name="chick" height={64} />
        <p className="text-lg text-amber-700">🐾 오늘의 계획을 가져오는 중...</p>
      </div>
    );
  }

  return (
    <div className="mx-auto max-w-7xl space-y-4">
      {/* 상단: 날짜 + 달성률 + 통계 */}
      <Card>
        <div className="flex flex-wrap items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <CharacterMascot name="hedgehog" height={54} />
            <div>
              <p className="text-xs font-bold text-rose-400">🐾 오늘 내가 정한 계획, 내가 해내기</p>
              <h2 className="text-2xl font-extrabold text-stone-700">📝 나의 스터디 플래너</h2>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <button
              type="button"
              onClick={() => setDate(addDays(date, -1))}
              className="rounded-full bg-amber-100 px-4 py-2 font-extrabold text-amber-700 hover:bg-amber-200"
              aria-label="어제"
            >
              ‹
            </button>
            <button
              type="button"
              onClick={() => setDate(todayKey)}
              className="min-w-44 rounded-full bg-rose-400 px-5 py-2 text-sm font-extrabold text-white shadow-md"
            >
              {date} ({weekdayLabel(date)}) {date === todayKey ? '· 오늘' : ''}
            </button>
            <button
              type="button"
              onClick={() => setDate(addDays(date, 1))}
              className="rounded-full bg-amber-100 px-4 py-2 font-extrabold text-amber-700 hover:bg-amber-200"
              aria-label="내일"
            >
              ›
            </button>
          </div>
        </div>

        <div className="mt-4 grid gap-4 md:grid-cols-[auto_auto_1fr]">
          <div className="flex items-center justify-center">
            <AchievementRing rate={stats.achievementRate} />
          </div>
          <div className="flex flex-col items-center justify-center gap-2">
            <SubjectDonut shares={stats.subjectShares} mode={statsMode} />
            <div className="flex gap-1">
              <PillButton
                active={statsMode === 'planned'}
                onClick={() => setStatsMode('planned')}
                className="px-3 py-1 text-xs"
              >
                계획
              </PillButton>
              <PillButton
                active={statsMode === 'done'}
                onClick={() => setStatsMode('done')}
                className="px-3 py-1 text-xs"
              >
                완료
              </PillButton>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2 sm:grid-cols-3">
            <StatBox emoji="📖" label="공부한 페이지" value={`${stats.donePages} / ${stats.plannedPages}p`} tone="rose" />
            <StatBox emoji="✏️" label="푼 문제" value={`${stats.doneProblems} / ${stats.plannedProblems}문제`} tone="sky" />
            <StatBox emoji="✅" label="끝낸 할 일" value={`${stats.doneCount} / ${stats.taskCount}개`} tone="emerald" />
            <StatBox emoji="⏱️" label="계획한 시간" value={`${Math.round(stats.totalMinutes / 60 * 10) / 10}시간`} tone="violet" />
            <StatBox emoji="💰" label="예상 포인트" value={`${calcPlannerPoints(day.tasks)}P / ${MAX_DAILY_PLANNER_POINTS}P`} tone="amber" />
            <div className="col-span-2 flex items-center justify-center rounded-2xl bg-gradient-to-r from-rose-50 to-amber-50 p-3 text-center text-sm font-bold text-rose-500 sm:col-span-1">
              {cheerMessage(stats.achievementRate)}
            </div>
          </div>
        </div>

        <div className="mt-3 flex flex-wrap items-center gap-2">
          {stats.subjectShares.map((share) => (
            <span
              key={share.subject}
              className="inline-flex items-center gap-1 rounded-full bg-amber-50 px-3 py-1 text-xs font-bold text-stone-600"
            >
              <span className="h-3 w-3 rounded-full" style={{ backgroundColor: share.color }} />
              {share.subject} {Math.round((statsMode === 'done' ? share.doneShare : share.plannedShare) * 100)}%
            </span>
          ))}
          {saving && <span className="text-xs font-bold text-stone-400">저장 중... 🐾</span>}
        </div>

        {notice && (
          <p className="mt-3 rounded-2xl bg-rose-50 px-4 py-3 text-sm font-bold text-rose-500">{notice}</p>
        )}
      </Card>

      {/* 기간 목표 */}
      <Card>
        <SectionTitle
          emoji="🎯"
          subtitle="기간을 정하면 하루 권장량을 자동으로 나눠 줄게요"
          title="나의 기간 목표"
          right={
            <button
              type="button"
              onClick={() => setGoalModalOpen(true)}
              className="rounded-full bg-rose-400 px-4 py-2 text-sm font-extrabold text-white shadow-md hover:bg-rose-500"
            >
              + 목표 만들기
            </button>
          }
        />
        {goals.length === 0 ? (
          <p className="rounded-2xl bg-amber-50 p-6 text-center text-sm font-bold text-stone-400">
            아직 목표가 없어요. &ldquo;와이수학 1권을 2주 안에 끝내기&rdquo; 같은 목표를 만들어 볼까요? 🦴
          </p>
        ) : (
          <div className="grid gap-3 md:grid-cols-2">
            {goals.map((goal) => (
              <GoalCard
                key={goal.id}
                goal={goal}
                todayKey={date}
                onRemove={() => handleRemoveGoal(goal.id)}
                onToggleHoliday={(d) => handleToggleHoliday(goal.id, d)}
                onToggleRestWeekday={(w) => handleToggleRestWeekday(goal.id, w)}
              />
            ))}
          </div>
        )}
      </Card>

      <div className="grid gap-4 lg:grid-cols-2">
        {/* 오늘 할 일 */}
        <Card>
          <SectionTitle
            emoji="📋"
            subtitle="시간표에 넣기 전에 먼저 할 일을 적어요"
            title="오늘 할 일"
            right={
              <div className="flex gap-2">
                <PillButton onClick={handleAutoFill}>🐶 자동으로 담기</PillButton>
                <button
                  type="button"
                  onClick={() => setTaskModalOpen(true)}
                  className="rounded-full bg-rose-400 px-4 py-2 text-sm font-extrabold text-white shadow-md hover:bg-rose-500"
                >
                  + 직접 추가
                </button>
              </div>
            }
          />
          {day.tasks.length === 0 ? (
            <p className="rounded-2xl bg-amber-50 p-6 text-center text-sm font-bold text-stone-400">
              오늘 할 일을 담아 주세요 🐾
            </p>
          ) : (
            <ul className="space-y-2">
              {day.tasks.map((task) => (
                <TaskRow
                  key={task.id}
                  task={task}
                  assigned={assignedTaskIds.has(task.id)}
                  onToggle={() => handleToggleTask(task.id)}
                  onChangeDone={(v) => handleChangeDoneAmount(task.id, v)}
                  onRemove={() => handleRemoveTask(task.id)}
                />
              ))}
            </ul>
          )}

          <button
            type="button"
            onClick={handleCloseDay}
            className="mt-4 w-full rounded-full bg-gradient-to-r from-rose-400 to-amber-400 px-5 py-3 text-base font-extrabold text-white shadow-lg shadow-rose-200 hover:from-rose-500 hover:to-amber-500"
          >
            🐾 오늘 공부 끝! 결과 저장하고 포인트 받기
          </button>
          <p className="mt-2 text-center text-xs font-bold text-stone-400">
            시간표는 &lsquo;가이드&rsquo;일 뿐이에요. 시간을 못 지켜도 괜찮아요 — 오늘 정한 양을 다 하는 게 더 중요해요! 🐶
          </p>
        </Card>

        {/* 시간표 */}
        <Card>
          <SectionTitle
            emoji="⏰"
            subtitle="빈칸을 눌러서 할 일을 넣어요 (끌지 않아도 돼요!)"
            title="오늘의 시간표"
            right={
              day.setupDone ? (
                <PillButton onClick={() => setDay((prev) => ({ ...prev, setupDone: false }))}>
                  ⚙️ 다시 설정
                </PillButton>
              ) : null
            }
          />

          {!day.setupDone ? (
            <TimetableSetup
              slotMinutes={day.slotMinutes}
              endHour={day.endHour}
              onConfirm={(slotMinutes, endHour) =>
                setDay((prev) => ({ ...prev, slotMinutes, endHour, setupDone: true, assignments: {} }))
              }
            />
          ) : (
            <div
              ref={timetableRef}
              className="max-h-[520px] overflow-y-auto rounded-2xl border-2 border-amber-100 bg-amber-50/40 p-2"
            >
              {slots.map((slot) => {
                const taskId = day.assignments?.[slot.index];
                const task = taskId ? tasksById[taskId] : null;
                const category = task ? CATEGORIES.find((c) => c.key === task.category) : null;
                const isNow =
                  date === todayKey && currentSlotIndex(slots) === slot.index;
                return (
                  <button
                    key={slot.index}
                    data-slot={slot.index}
                    type="button"
                    onClick={() => setSlotPickerIndex(slot.index)}
                    className={`mb-1.5 flex w-full items-center gap-3 rounded-2xl border-2 p-2 text-left transition hover:-translate-y-0.5 hover:shadow-md ${
                      isNow ? 'border-rose-300 bg-rose-50' : 'border-transparent bg-white'
                    }`}
                  >
                    <span className="w-14 shrink-0 text-xs font-extrabold text-stone-400">
                      {slot.label}
                    </span>
                    {task ? (
                      <span
                        className="flex min-w-0 flex-1 items-center gap-2 rounded-xl px-3 py-2"
                        style={{ backgroundColor: `${category?.color ?? '#F9A8D4'}55` }}
                      >
                        <span className="text-lg">{category?.emoji ?? '🐶'}</span>
                        <span className="min-w-0 flex-1">
                          <span className="block truncate text-sm font-extrabold text-stone-700">
                            {task.title || task.workbook}
                          </span>
                          <span className="block truncate text-[11px] font-bold text-stone-500">
                            {category?.label} · {task.amount}
                            {task.unit === 'problem' ? '문제' : 'p'}
                          </span>
                        </span>
                        {task.done && <span className="text-lg">✅</span>}
                      </span>
                    ) : (
                      <span className="flex-1 rounded-xl border-2 border-dashed border-amber-200 px-3 py-2 text-xs font-bold text-stone-300">
                        + 여기를 눌러 할 일 넣기
                      </span>
                    )}
                    {isNow && <span className="shrink-0 text-lg">🐕</span>}
                  </button>
                );
              })}
            </div>
          )}
        </Card>
      </div>

      {/* 모달들 */}
      {goalModalOpen && (
        <GoalFormModal onClose={() => setGoalModalOpen(false)} onSubmit={handleAddGoal} />
      )}
      {taskModalOpen && (
        <TaskFormModal onClose={() => setTaskModalOpen(false)} onSubmit={handleAddTask} />
      )}
      {slotPickerIndex !== null && (
        <Modal
          title={`${slots[slotPickerIndex]?.label} 에 뭘 할까요?`}
          subtitle="할 일 리스트에서 하나를 골라 주세요"
          onClose={() => setSlotPickerIndex(null)}
        >
          {day.tasks.length === 0 ? (
            <p className="p-4 text-center text-sm font-bold text-stone-400">
              먼저 &lsquo;오늘 할 일&rsquo;에 계획을 담아 주세요 🐾
            </p>
          ) : (
            <ul className="space-y-2">
              {day.tasks.map((task) => {
                const category = CATEGORIES.find((c) => c.key === task.category);
                return (
                  <li key={task.id}>
                    <button
                      type="button"
                      onClick={() => handleAssignSlot(slotPickerIndex, task.id)}
                      className="flex w-full items-center gap-3 rounded-2xl border-2 border-white bg-white p-3 text-left shadow-sm hover:border-rose-200"
                    >
                      <span className="text-2xl">{category?.emoji}</span>
                      <span className="min-w-0 flex-1">
                        <span className="block truncate font-extrabold text-stone-700">
                          {task.title || task.workbook}
                        </span>
                        <span className="block truncate text-xs font-bold text-stone-400">
                          {category?.label} · {task.amount}
                          {task.unit === 'problem' ? '문제' : 'p'} · 약 {task.minutes}분
                        </span>
                      </span>
                      {assignedTaskIds.has(task.id) && (
                        <span className="shrink-0 rounded-full bg-amber-100 px-2 py-1 text-[10px] font-bold text-amber-700">
                          이미 배정됨
                        </span>
                      )}
                    </button>
                  </li>
                );
              })}
            </ul>
          )}
          <button
            type="button"
            onClick={() => handleAssignSlot(slotPickerIndex, null)}
            className="mt-3 w-full rounded-full bg-stone-100 px-4 py-2 text-sm font-bold text-stone-500 hover:bg-stone-200"
          >
            이 칸 비우기
          </button>
        </Modal>
      )}
      {missModal && (
        <MissStrategyModal
          tasks={missModal.tasks}
          onClose={() => setMissModal(null)}
          onSelect={handleApplyMissStrategy}
        />
      )}
    </div>
  );
}

function GoalCard({ goal, todayKey, onRemove, onToggleHoliday, onToggleRestWeekday }) {
  const [open, setOpen] = useState(false);
  const category = CATEGORIES.find((c) => c.key === goal.category);
  const summary = summarizeGoal(goal, todayKey);
  const unitLabel = goal.unit === 'problem' ? '문제' : 'p';
  const upcoming = useMemo(
    () => listStudyDates(goal.startDate, goal.endDate, [], []).slice(0, 21),
    [goal.startDate, goal.endDate]
  );
  const holidaySet = new Set(goal.holidays ?? []);

  return (
    <div className="rounded-2xl border-2 border-amber-100 bg-amber-50/50 p-4">
      <div className="flex items-start gap-3">
        <span className="text-2xl">{category?.emoji}</span>
        <div className="min-w-0 flex-1">
          <p className="truncate font-extrabold text-stone-700">{goal.title || goal.workbook}</p>
          <p className="truncate text-xs font-bold text-stone-400">
            {category?.label} · {goal.startDate} ~ {goal.endDate}
          </p>
        </div>
        <button
          type="button"
          onClick={onRemove}
          className="shrink-0 rounded-full bg-white px-3 py-1 text-xs font-bold text-stone-400 hover:text-rose-500"
        >
          삭제
        </button>
      </div>

      <div className="mt-3 h-3 overflow-hidden rounded-full bg-white">
        <div
          className="h-full rounded-full bg-gradient-to-r from-rose-300 to-amber-300"
          style={{ width: `${Math.min(100, Math.round(summary.progressRate * 100))}%` }}
        />
      </div>
      <div className="mt-2 flex flex-wrap gap-x-3 gap-y-1 text-xs font-bold text-stone-500">
        <span>
          📚 {summary.done} / {summary.total}
          {unitLabel}
        </span>
        <span>🗓️ 남은 공부일 {summary.remainingDays}일</span>
        <span className="text-rose-500">
          🐾 하루 {summary.perDay}
          {unitLabel}씩
        </span>
        {goal.carryOver > 0 && <span className="text-amber-600">⏭️ 밀린 양 {goal.carryOver}{unitLabel}</span>}
        {summary.isFinished && <span className="text-emerald-500">🎉 다 끝냈어요!</span>}
        {summary.isOverdue && <span className="text-rose-500">⏰ 기간이 지났어요</span>}
      </div>

      <button
        type="button"
        onClick={() => setOpen((v) => !v)}
        className="mt-3 w-full rounded-full bg-white px-3 py-2 text-xs font-bold text-amber-700 hover:bg-amber-100"
      >
        {open ? '휴일 설정 접기 ▲' : '🛌 공부 안 하는 날 정하기 ▼'}
      </button>

      {open && (
        <div className="mt-3 space-y-3">
          <div>
            <p className="mb-1 text-xs font-bold text-stone-500">매주 쉬는 요일</p>
            <div className="flex gap-1">
              {WEEKDAYS.map((label, index) => {
                const active = (goal.restWeekdays ?? []).includes(index);
                return (
                  <button
                    key={label}
                    type="button"
                    onClick={() => onToggleRestWeekday(index)}
                    className={`h-8 w-8 rounded-full text-xs font-extrabold ${
                      active ? 'bg-rose-400 text-white' : 'bg-white text-stone-500 hover:bg-amber-100'
                    }`}
                  >
                    {label}
                  </button>
                );
              })}
            </div>
          </div>
          <div>
            <p className="mb-1 text-xs font-bold text-stone-500">콕 집어 쉬는 날 (누르면 휴일)</p>
            <div className="flex max-h-28 flex-wrap gap-1 overflow-y-auto">
              {upcoming.map((d) => {
                const active = holidaySet.has(d);
                return (
                  <button
                    key={d}
                    type="button"
                    onClick={() => onToggleHoliday(d)}
                    className={`rounded-full px-2 py-1 text-[11px] font-bold ${
                      active ? 'bg-rose-400 text-white' : 'bg-white text-stone-500 hover:bg-amber-100'
                    }`}
                  >
                    {d.slice(5)} {weekdayLabel(d)}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function normalizePlanner(raw) {
  return {
    goals: Array.isArray(raw?.goals) ? raw.goals : [],
    days: raw?.days && typeof raw.days === 'object' ? raw.days : {},
  };
}


function Preview(){
  const [pts,setPts]=useState(1240);
  useEffect(()=>{const b=document.getElementById('pointBadge');if(b)b.textContent='💰 '+pts.toLocaleString()+' P';},[pts]);
  return <StudyPlanner userName="미리보기" onPointsAwarded={(a)=>setPts(p=>p+a)} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Preview/>);
</script>
<div class="mx-auto max-w-7xl px-4 pb-10 pt-2 text-center text-xs font-bold text-stone-400">
  미리보기 · 구글 시트 대신 브라우저 저장소를 씁니다. 초기화하려면
  <button onclick="localStorage.removeItem('planner-preview');location.reload()" class="rounded-full bg-white px-3 py-1 text-rose-500 shadow-sm">여기</button>
</div>
</body></html>
